[[redirects]]
  from = "https://www.alldevtool.netlify.app/*"
  to = "https://devtoolsonline.dev/:splat"
  status = 301
  force = true

# SPA fallback handled by public/_redirects.
# Edge function og-meta removed: prerendered HTML now provides per-tool meta
# tags directly, so the runtime injection is redundant and adds cold-start.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, max-age=3600, must-revalidate"
